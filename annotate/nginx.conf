# Poke annotation under https://<host>/annotate/ -- add to the same server { } block as userstudy/nginx.conf
# (reuses its limit_req_zone study_api). Replace /path/to/poke_to_video.
location = /annotate { return 301 /annotate/; }
location /annotate/ {
    alias /path/to/poke_to_video/annotate/site/;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~* \.jpg$ { expires 7d; }
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
}
location /annotate/api/ {
    limit_req zone=study_api burst=20 nodelay;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8766/api/;
    proxy_set_header Host $host;
}
