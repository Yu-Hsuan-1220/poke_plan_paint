# User study under https://<host>/study/  -- copy into a server { } block (e.g. /etc/nginx/sites-available/default)
# and replace /path/to/poke_to_video. nginx serves the static site + media; /study/api/ goes to userstudy/server.py.
# The nginx user must be able to read userstudy/site/.

# (http { } level, i.e. outside server { }): at most ~5 API requests/s per client, bursts of 20
limit_req_zone $binary_remote_addr zone=study_api:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    location = /study { return 301 /study/; }

    location /study/ {
        alias /path/to/poke_to_video/userstudy/site/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # mp4 / jpg names are content hashes, safe to cache; html/js/css revalidate
        location ~* \.(mp4|jpg)$ { expires 7d; add_header Cache-Control "public"; }
        location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
    }

    location /study/api/ {
        limit_req zone=study_api burst=20 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
